<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      var search = window.location.search || "";
      var hash = String(window.location.hash || "").replace(/^#/, "").trim().toLowerCase();
      var states = { login: 1, "forgot-password": 1, "reset-password": 1 };
      if (!states[hash]) hash = "login";
      var target = "auth.html" + search + "#" + hash;
      var link = document.querySelector('link[rel="canonical"]');
      if (link) link.setAttribute("href", target);
      window.location.replace(target);
    })();
  </script>
  <link rel="canonical" href="auth.html#login">
  <title>Dashboard Login - DS ATELIER</title>
  <meta name="description" content="Sign in to the DS ATELIER Dashboard. Authentication is not configured yet. This page is a UI prototype.">
</head>
<body>
  <p>Redirecting to <a href="auth.html#login">Dashboard Login</a>.</p>
</body>
</html>
