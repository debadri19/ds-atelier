<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("ds-atelier-theme"); } catch (e) {}
      if (!theme) theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard Login - DS ATELIER</title>
  <meta name="description" content="Sign in to the DS ATELIER Dashboard. Authentication is not configured yet. This page is a UI prototype.">
  <link rel="icon" href="../assets/images/brand/logo-icon.png">
  <link rel="apple-touch-icon" href="../assets/images/brand/logo-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/admin-login.css">
</head>
<body class="admin-login-body">
  <div class="admin-login-page">
    <button class="admin-icon-btn admin-login-theme" type="button" data-theme-toggle aria-label="Toggle theme">
      <i class="fa-regular fa-sun icon-sun" aria-hidden="true"></i>
      <i class="fa-regular fa-moon icon-moon" aria-hidden="true"></i>
    </button>

    <main class="admin-login-card" id="admin-login-main" data-auth-state="login">
      <div class="admin-login-brand">
        <img class="admin-login-logo" src="../assets/images/brand/logo-full.png" alt="DS ATELIER">
        <p class="admin-login-kicker">Dashboard</p>
      </div>
      <div class="admin-login-head">
        <h1 class="admin-login-title" id="admin-auth-title">Login</h1>
        <p class="admin-login-copy" id="admin-auth-copy">Sign in to access your studio dashboard.</p>
      </div>

      <form class="admin-login-form" data-admin-auth-form="login" data-admin-login novalidate aria-labelledby="admin-auth-title">
        <div class="form-field" data-field="identifier">
          <i class="form-icon fa-solid fa-user" aria-hidden="true"></i>
          <label class="form-label" for="admin-login-identifier">Email Address or Username</label>
          <input class="form-input" id="admin-login-identifier" name="identifier" type="text" placeholder=" " autocomplete="username" spellcheck="false" autocapitalize="none" required aria-describedby="admin-login-identifier-error">
          <p class="form-error" id="admin-login-identifier-error"></p>
        </div>
        <div class="form-field" data-field="password">
          <i class="form-icon fa-solid fa-lock" aria-hidden="true"></i>
          <label class="form-label" for="admin-login-password">Password</label>
          <input class="form-input" id="admin-login-password" name="password" type="password" placeholder=" " autocomplete="current-password" required aria-describedby="admin-login-password-error">
          <button class="form-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">
            <i class="fa-regular fa-eye" aria-hidden="true"></i>
          </button>
          <p class="form-error" id="admin-login-password-error"></p>
        </div>
        <div class="admin-login-row">
          <label class="admin-login-check">
            <input type="checkbox" id="admin-login-remember" name="remember" value="presentation">
            Remember Me
          </label>
          <a class="admin-login-link" href="#forgot-password">Forgot Password?</a>
        </div>
        <p class="admin-login-note" data-admin-login-note role="status" aria-live="polite"></p>
        <button class="btn btn-primary" type="submit" data-admin-login-submit>Sign In</button>
      </form>

      <form class="admin-login-form" data-admin-auth-form="forgot-password" data-admin-forgot-form novalidate aria-labelledby="admin-auth-title" hidden>
        <div class="form-field" data-field="email">
          <i class="form-icon fa-solid fa-envelope" aria-hidden="true"></i>
          <label class="form-label" for="admin-forgot-email">Email Address</label>
          <input class="form-input" id="admin-forgot-email" name="email" type="email" placeholder=" " autocomplete="email" spellcheck="false" autocapitalize="none" required aria-describedby="admin-forgot-email-error">
          <p class="form-error" id="admin-forgot-email-error"></p>
        </div>
        <p class="admin-login-note" data-admin-forgot-note role="status" aria-live="polite"></p>
        <button class="btn btn-primary" type="submit" data-admin-forgot-submit>Send Reset Link</button>
      </form>
      <p class="admin-login-switch" data-admin-auth-switch="forgot-password" hidden>
        <a class="admin-login-link" href="#login">Back to Login</a>
      </p>

      <form class="admin-login-form" data-admin-auth-form="reset-password" data-admin-reset-form novalidate aria-labelledby="admin-auth-title" hidden>
        <div class="form-field" data-field="password">
          <i class="form-icon fa-solid fa-lock" aria-hidden="true"></i>
          <label class="form-label" for="admin-reset-password">New Password</label>
          <input class="form-input" id="admin-reset-password" name="password" type="password" placeholder=" " autocomplete="new-password" required minlength="8" aria-describedby="admin-reset-password-error">
          <button class="form-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">
            <i class="fa-regular fa-eye" aria-hidden="true"></i>
          </button>
          <p class="form-error" id="admin-reset-password-error"></p>
        </div>
        <div class="form-field" data-field="confirm">
          <i class="form-icon fa-solid fa-lock" aria-hidden="true"></i>
          <label class="form-label" for="admin-reset-confirm">Confirm New Password</label>
          <input class="form-input" id="admin-reset-confirm" name="confirm" type="password" placeholder=" " autocomplete="new-password" required minlength="8" aria-describedby="admin-reset-confirm-error">
          <button class="form-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">
            <i class="fa-regular fa-eye" aria-hidden="true"></i>
          </button>
          <p class="form-error" id="admin-reset-confirm-error"></p>
        </div>
        <p class="admin-login-note" data-admin-reset-note role="status" aria-live="polite"></p>
        <button class="btn btn-primary" type="submit" data-admin-reset-submit>Reset Password</button>
      </form>
      <p class="admin-login-switch" data-admin-auth-switch="reset-password" hidden>
        <a class="admin-login-link" href="#login">Back to Login</a>
      </p>
    </main>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
